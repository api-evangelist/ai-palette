aid: ai-palette
name: AI Palette
description: >-
  AI Palette is an AI-first consumer-insights and product-innovation platform for
  the Consumer Packaged Goods (CPG) industry. Founded in Singapore in 2018 and
  later acquired by GlobalData, it aggregates more than 61 billion data points
  across 24 countries and 18 languages to help food, beverage, and personal-care
  brands discover emerging trends, generate and screen new product concepts, and
  bring winning products to market faster. Its platform spans the Foresight Engine
  for real-time trend discovery, Concept Genie for generative-AI concept creation,
  Screen Winner for concept validation, and the FoodGPT / Arya agentic co-pilot.
  Customers include Nestle, Mondelez, Kellogg, Diageo, Cargill, ADM, and Symrise.
  This is an enterprise SaaS platform accessed by license; no public developer API,
  SDK, or specification is published.
